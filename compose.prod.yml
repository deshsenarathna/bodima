version: "3.9"
services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: bodima-backend
    restart: always
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    networks:
      - appnet
    depends_on:
      - mysql

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: bodima-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - appnet

  mysql:
    image: mysql:8
    container_name: bodima-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bodima
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    # Not exposing MySQL publicly; reachable to backend inside network
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  mysql-data:
