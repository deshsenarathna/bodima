[web]
# Replace with your EC2 public DNS or IP
web1 ansible_host=YOUR_EC2_PUBLIC_DNS ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/your-key.pem

[all:vars]
backend_image=ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/bodima-backend:latest
frontend_image=ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/bodima-frontend:latest
spring_datasource_url=jdbc:mysql://YOUR_RDS_ENDPOINT:3306/bodima_db
spring_datasource_username=YOUR_DB_USER
spring_datasource_password=YOUR_DB_PASSWORD
aws_region=ap-south-1
